name: Publish Linear CLI rolling release

on:
  push:
    branches:
      - main

concurrency:
  group: ship-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  DENO_VERSION: "2.9.4"
  NO_COLOR: "1"

jobs:
  keyring:
    name: Verify Linux Keyring integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Cache Deno dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ env.DENO_VERSION }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-${{ env.DENO_VERSION }}-

      - name: Set up Secret Service
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus-x11 gnome-keyring libsecret-tools
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          echo "test-password" | gnome-keyring-daemon --unlock --components=secrets

      - name: Run keyring integration test
        env:
          LINEAR_KEYRING_INTEGRATION: "1"
        run: deno task test test/keyring.integration.test.ts

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Cache Deno dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ env.DENO_VERSION }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-${{ env.DENO_VERSION }}-

      - name: Generate GraphQL types
        run: deno task generate-graphql-types

      - name: Set release version
        shell: bash
        run: |
          timestamp="$(git show -s --format=%ct "$GITHUB_SHA")"
          version="0.0.${timestamp}-g${GITHUB_SHA::7}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          VERSION="$version" deno eval '
            const path = "deno.json"
            const config = JSON.parse(await Deno.readTextFile(path))
            config.version = Deno.env.get("VERSION")
            await Deno.writeTextFile(path, `${JSON.stringify(config, null, 2)}\n`)
          '

      - name: Compile release assets
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          started_at="$SECONDS"
          output_dir="target/distrib/$TARGET"
          mkdir -p release "$output_dir"

          if [[ "$TARGET" == "x86_64-pc-windows-msvc" ]]; then
            binary="linear.exe"
            archive="release/linear-$TARGET.zip"
            self_update_asset="release/linear-self-update-$TARGET.exe"
          else
            binary="linear"
            archive="release/linear-$TARGET.tar.xz"
            self_update_asset="release/linear-self-update-$TARGET"
          fi

          deno compile \
            --allow-all \
            --frozen \
            --lock=deno.lock \
            --quiet \
            --target="$TARGET" \
            --output="$output_dir/$binary" \
            src/main.ts

          # Keep a raw binary for `linear update`. The self-update prefix
          # prevents it from outranking the archive in mise asset selection.
          cp "$output_dir/$binary" "$self_update_asset"
          if [[ "$TARGET" == "x86_64-pc-windows-msvc" ]]; then
            (cd "$output_dir" && zip -q "$GITHUB_WORKSPACE/$archive" "$binary")
          else
            tar -C "$output_dir" -cJf "$archive" "$binary"
          fi

          if [[ "$TARGET" == "x86_64-unknown-linux-gnu" ]]; then
            actual_version="$("$output_dir/$binary" --version)"
            if [[ "$actual_version" != "linear $VERSION" ]]; then
              echo "Expected linear $VERSION, got $actual_version" >&2
              exit 1
            fi

            probe="$("$output_dir/$binary" version --json)"
            PROBE="$probe" EXPECTED_VERSION="$VERSION" deno eval '
              const probe = JSON.parse(Deno.env.get("PROBE"))
              const expectedVersion = Deno.env.get("EXPECTED_VERSION")
              if (
                probe.schemaVersion !== 1 ||
                probe.distribution !== "jihuanshe/linear" ||
                probe.version !== expectedVersion ||
                !Array.isArray(probe.capabilities) ||
                !probe.capabilities.includes("usage-v1")
              ) {
                console.error("Unexpected version probe", probe)
                Deno.exit(1)
              }
            '
          fi

          archive="${archive#release/}"
          self_update_asset="${self_update_asset#release/}"
          (
            cd release
            sha256sum "$archive" > "$archive.sha256"
            sha256sum "$self_update_asset" > "$self_update_asset.sha256"
          )
          echo "Built $TARGET in $((SECONDS - started_at))s"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.target }}
          path: release/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub rolling release
    needs:
      - keyring
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set release version
        shell: bash
        run: |
          timestamp="$(git show -s --format=%ct "$GITHUB_SHA")"
          version="0.0.${timestamp}-g${GITHUB_SHA::7}"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: artifacts

      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t checksums < <(
            find artifacts -maxdepth 1 -type f -name '*.sha256' -print0
          )
          if ((${#checksums[@]} != 10)); then
            echo "Expected 10 checksum files, got ${#checksums[@]}" >&2
            exit 1
          fi
          for checksum in "${checksums[@]}"; do
            (
              cd artifacts
              sha256sum --check "$(basename "$checksum")"
            )
          done

          mapfile -t release_artifacts < <(
            find artifacts -maxdepth 1 -type f \
              \( -name '*.tar.xz' -o -name '*.zip' -o -name 'linear-self-update-*' \) \
              ! -name '*.sha256' -printf '%f\n' | sort
          )
          if ((${#release_artifacts[@]} != 10)); then
            echo "Expected 10 distributables, got ${#release_artifacts[@]}" >&2
            exit 1
          fi
          (cd artifacts && sha256sum "${release_artifacts[@]}" > sha256.sum)

      - id: prepare
        name: Prepare draft release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            target="$(
              gh release view "$VERSION" \
                --repo "$GITHUB_REPOSITORY" \
                --json targetCommitish \
                --jq .targetCommitish
            )"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "Release $VERSION points to $target, not $GITHUB_SHA" >&2
              exit 1
            fi

            is_draft="$(
              gh release view "$VERSION" \
                --repo "$GITHUB_REPOSITORY" \
                --json isDraft \
                --jq .isDraft
            )"
            if [[ "$is_draft" != "true" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            gh release upload "$VERSION" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$VERSION" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --generate-notes \
              --draft
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Attest release assets
        if: steps.prepare.outputs.skip != 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/*.tar.xz
            artifacts/*.zip
            artifacts/linear-self-update-*-darwin
            artifacts/linear-self-update-*-linux-gnu
            artifacts/linear-self-update-*-windows-msvc.exe

      - name: Publish GitHub rolling release
        if: steps.prepare.outputs.skip != 'true'
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          latest=false
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            latest=true
          fi
          gh release edit "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest="$latest"

      - name: Add release summary
        run: |
          url="$(
            gh release view "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --json url \
              --jq .url
          )"
          echo "Released [$VERSION]($url)" >> "$GITHUB_STEP_SUMMARY"

  linear-release:
    name: Record completed Linear release
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: metadata
        name: Resolve release metadata
        shell: bash
        run: |
          set -euo pipefail
          timestamp="$(git show -s --format=%ct "$GITHUB_SHA")"
          version="0.0.${timestamp}-g${GITHUB_SHA::7}"
          url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - id: linear_release
        name: Record completed release in Linear
        uses: linear/linear-release-action@af56a9a388625921f3757a2f988e4d7aca958377
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          version: ${{ steps.metadata.outputs.version }}
          name: ${{ steps.metadata.outputs.version }}
          base_ref: ${{ github.event.before }}
          links: |
            GitHub Release=${{ steps.metadata.outputs.url }}

      - name: Verify completed Linear release
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_ID: ${{ steps.linear_release.outputs.release-id }}
          RELEASE_URL: ${{ steps.linear_release.outputs.release-url }}
          RELEASE_VERSION: ${{ steps.linear_release.outputs.release-version }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID"
          test -n "$RELEASE_URL"
          if [[ "$RELEASE_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Expected Linear release $EXPECTED_VERSION, got $RELEASE_VERSION" >&2
            exit 1
          fi
