name: Verify Linear CLI pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NO_COLOR: "1"

jobs:
  source:
    name: Source gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.1"
          install_args: "--locked deno node npm:markdownlint-cli2 github:huacnlee/autocorrect prek"

      - name: Cache Deno dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('mise.lock', 'deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Verify release source
        run: deno task verify-release

      - name: Check verification left the checkout unchanged
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
