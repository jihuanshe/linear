name: Verify Linear CLI pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DENO_VERSION: "2.9.4"
  NO_COLOR: "1"

jobs:
  source:
    name: Source gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Cache Deno dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ env.DENO_VERSION }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-${{ env.DENO_VERSION }}-

      - name: Verify release source
        run: deno task verify-release
